name: Static browser app CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Check HTML, stylesheet, and script entry points
        run: |
          test -s index.html
          test -s styles.css
          grep -Fq 'src="app.js"' index.html
          grep -Fq 'href="styles.css"' index.html
      - name: Check static server serves app files
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/money-map-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/index.html; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null http://127.0.0.1:8765/app.js
          curl --fail --silent --output /dev/null http://127.0.0.1:8765/styles.css
